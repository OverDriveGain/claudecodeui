[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-discovery"
version = "0.1.0"
description = "Local agent registry daemon for Claude Code sessions"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agent-discovery = "agent_discovery.cli:main"
claudeui-register = "agent_discovery.cli:_claudeui_register"
claudeui-unregister = "agent_discovery.cli:_claudeui_unregister"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_discovery*"]
