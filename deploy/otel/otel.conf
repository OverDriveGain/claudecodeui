# systemd drop-in enabling OpenTelemetry tracing for the BLDR generation fan-out.
# Install as: ~/.config/systemd/user/bti-webapp-ccui-dev.service.d/otel.conf
# Remove the file (+ daemon-reload & restart) to switch tracing off — the app
# no-ops without the flag.
[Service]
Environment=BLDR_OTEL=1
# Optional overrides:
#Environment=BLDR_OTEL_ENDPOINT=http://10.10.0.1:4318
#Environment=BLDR_OTEL_DEBUG=1   # DEBUG ONLY: attaches truncated prompt/brief text to spans
