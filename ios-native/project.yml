# XcodeGen spec for the native MyMu iOS client.
# Generate the project on the build Mac with:  xcodegen generate
# (the .xcodeproj is generated, not committed — rsync --delete wipes it).
name: MyMu
options:
  bundleIdPrefix: com.mymu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Set on the build host (or in Xcode) — left empty so no team leaks into git.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "11"

targets:
  MyMu:
    type: application
    platform: iOS
    sources:
      - MyMu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mymu.app
        INFOPLIST_FILE: MyMu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # UI-test target — simulator only, not shipped. Guards the iPad composer
  # "+" attach path (App Store 2.1(a) rejection, submission c5bff108).
  MyMuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MyMuUITests
    dependencies:
      - target: MyMu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mymu.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MyMu

schemes:
  MyMu:
    build:
      targets:
        MyMu: all
        MyMuUITests: [test]
    test:
      targets:
        - MyMuUITests
    run:
      config: Debug
